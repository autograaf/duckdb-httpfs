#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-slim' }}
    name: Prepare
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

  build:
    name: Build extension
    uses: autograaf/extension-ci-tools/.github/workflows/build.yml@windows-arm64-openssl-o1
    needs:
      - prepare
    with:
      groups: |
        main:
          config: extension_config.cmake
          toolchain: main
      ci_tools_repository: autograaf/extension-ci-tools
      ci_tools_version: windows-arm64-openssl-o1
      opt_in_archs: windows_arm64
      exclude_archs: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
      reduced_ci_mode: disabled
      runners: ${{ needs.prepare.outputs.runners }}

  deploy:
    name: Deploy extension
    if: ${{ startsWith(github.ref_name, 'v') || github.ref_name == 'main' }}
    needs:
      - build
    uses: duckdb/extension-ci-tools/.github/workflows/deploy.yml@main
    secrets: inherit
    with:
      duckdb_version: ${{ needs.build.outputs.duckdb_version }}
      duckdb_commit: ${{ needs.build.outputs.duckdb_commit }}
      deploy_extensions: httpfs
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/main' }}
